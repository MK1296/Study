<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>タスク新規登録</title>
    <link rel="stylesheet" th:href="@{/css/task-list.css}">
</head>

<body>

    <div class="container">

        <h1>タスク新規登録</h1>
        <p class="subtitle">新しいタスクを登録しましょう。</p>

        <div class="form-card">

            <form th:action="@{/tasks/create}" th:object="${task}" method="post">

                <div class="form-group">
                    <label>タスク名</label>
                    <input type="text" th:field="*{taskName}" maxlength="100"
                           placeholder="タスク名を入力してください">
                    <div class="error-message"
                         th:if="${#fields.hasErrors('taskName')}"
                         th:errors="*{taskName}">
                    </div>
                </div>

                <div class="form-group">
                    <label>タスク詳細</label>
                    <textarea th:field="*{taskDetail}"
                              placeholder="タスクの詳細を入力してください"></textarea>
                    <div class="error-message"
                         th:if="${#fields.hasErrors('taskDetail')}"
                         th:errors="*{taskDetail}">
                    </div>
                </div>

                <div class="form-group">
    				<label>ユーザー</label>
    				<select th:field="*{userId}">
        				<option value="">ユーザーを選択してください</option>
        				<option th:each="user : ${users}"
                				th:value="${user.userId}"
                				th:text="${user.userName}">
        				</option>
    				</select>

    				<div class="error-message"
         				th:if="${#fields.hasErrors('userId')}"
         				th:errors="*{userId}">
    				</div>
				</div>

                <div class="form-group">
                    <label>カテゴリーID</label>
                    <input type="number" th:field="*{categoryId}"
                           placeholder="カテゴリーIDを入力してください">
                    <div class="error-message"
                         th:if="${#fields.hasErrors('categoryId')}"
                         th:errors="*{categoryId}">
                    </div>
                </div>

                <div class="form-group">
                    <label>期限</label>
                    <input type="date" th:field="*{dueDate}">
                </div>

                <div class="form-group">
                    <label>ステータス</label>
                    <select th:field="*{status}">
                        <option value="未着手">未着手</option>
                        <option value="進行中">進行中</option>
                        <option value="完了">完了</option>
                    </select>
                    <div class="error-message"
                         th:if="${#fields.hasErrors('status')}"
                         th:errors="*{status}">
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit">登録する</button>
                    <a class="button clear-button" th:href="@{/tasks}">
                        一覧に戻る
                    </a>
                </div>

            </form>

        </div>

    </div>

</body>
</html>
