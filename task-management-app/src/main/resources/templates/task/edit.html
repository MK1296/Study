<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>タスク更新</title>
    <link rel="stylesheet" th:href="@{/css/task-list.css}">
</head>

<body>

    <div class="container">

        <h1>タスク更新</h1>
        <p class="subtitle">タスクの内容を確認・編集できます。</p>

        <div class="form-card">

            <form th:action="@{/tasks/edit}" th:object="${task}" method="post">

                <!-- タスクID -->
                <input type="hidden" th:field="*{taskId}">

                <!-- ユーザーID -->
                <div class="form-group">
                    <label>ユーザーID</label>
                    <input type="number" th:field="*{userId}">

                    <div class="error-message"
                         th:if="${#fields.hasErrors('userId')}"
                         th:errors="*{userId}">
                    </div>
                </div>

                <!-- カテゴリーID -->
                <div class="form-group">
                    <label>カテゴリーID</label>
                    <input type="number" th:field="*{categoryId}">

                    <div class="error-message"
                         th:if="${#fields.hasErrors('categoryId')}"
                         th:errors="*{categoryId}">
                    </div>
                </div>

                <!-- タスク名 -->
                <div class="form-group">
                    <label>タスク名</label>
                    <input type="text" th:field="*{taskName}" maxlength="100">

                    <div class="error-message"
                         th:if="${#fields.hasErrors('taskName')}"
                         th:errors="*{taskName}">
                    </div>
                </div>

                <!-- タスク詳細 -->
                <div class="form-group">
                    <label>タスク詳細</label>
                    <textarea th:field="*{taskDetail}"></textarea>

                    <div class="error-message"
                         th:if="${#fields.hasErrors('taskDetail')}"
                         th:errors="*{taskDetail}">
                    </div>
                </div>

                <!-- 期限 -->
                <div class="form-group">
                    <label>期限</label>
                    <input type="date" th:field="*{dueDate}">
                </div>

                <!-- ステータス -->
                <div class="form-group">
                    <label>ステータス</label>

                    <select th:field="*{status}">
                        <option value="未着手">未着手</option>
                        <option value="進行中">進行中</option>
                        <option value="完了">完了</option>
                    </select>

                    <div class="error-message"
                         th:if="${#fields.hasErrors('status')}"
                         th:errors="*{status}">
                    </div>
                </div>

                <!-- 操作ボタン -->
                <div class="form-buttons">
                    <button type="submit">更新する</button>

                    <a class="button clear-button" th:href="@{/tasks}">
                        一覧に戻る
                    </a>
                </div>

            </form>

        </div>

    </div>

</body>
</html>
