<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>受注登録</title>
</head>
<body>

    <h1>受注登録画面</h1>

    <!-- 重複エラーメッセージ -->
    <div
        th:if="${duplicateError}"
        style="color:red;">
        <p th:text="${duplicateError}"></p>
    </div>

    <form
        th:object="${order}"
        th:action="${order.orderId == null} ? @{/orders/save} : @{/orders/update}"
        method="post">

        <!-- 編集時用 -->
        <input type="hidden" th:field="*{orderId}">

        <div>
            <label>受注番号</label>

            <input type="text" th:field="*{orderNo}">

            <div
                th:if="${#fields.hasErrors('orderNo')}"
                th:errors="*{orderNo}">
            </div>
        </div>

        <br>

        <div>
            <label>購入者名</label>

            <input type="text" th:field="*{customerName}">

            <div
                th:if="${#fields.hasErrors('customerName')}"
                th:errors="*{customerName}">
            </div>
        </div>

        <br>

        <div>
            <label>商品</label>

            <select th:field="*{productId}">

                <option value="">選択してください</option>

                <option
                    th:each="product : ${productMap}"
                    th:value="${product.key}"
                    th:text="${product.value}">
                </option>

            </select>

            <div
                th:if="${#fields.hasErrors('productId')}"
                th:errors="*{productId}">
            </div>
        </div>

        <br>

        <div>
            <label>数量</label>

            <input type="number" th:field="*{quantity}">

            <div
                th:if="${#fields.hasErrors('quantity')}"
                th:errors="*{quantity}">
            </div>
        </div>

        <br>

        <div>
            <label>ステータス</label>

            <input type="text" th:field="*{orderStatus}">

            <div
                th:if="${#fields.hasErrors('orderStatus')}"
                th:errors="*{orderStatus}">
            </div>
        </div>

        <br>

        <div>
            <label>受注日</label>

            <input type="date" th:field="*{orderDate}">

            <div
                th:if="${#fields.hasErrors('orderDate')}"
                th:errors="*{orderDate}">
            </div>
        </div>

        <br>

        <div>
            <label>希望納期</label>

            <input type="date" th:field="*{deliveryDate}">
        </div>

        <br>

        <button
            type="submit"
            th:text="${order.orderId == null} ? '登録' : '更新'">
        </button>

    </form>

    <br>

    <a href="/orders">一覧へ戻る</a>

</body>
</html>
